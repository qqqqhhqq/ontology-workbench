# 真实 Agent / 大模型接入配置模板（可复制为 config/llm.local.yaml 后填入真实 Key）
# 支持协议：openai_compatible（覆盖 OpenAI / DeepSeek / 通义千问 / 智谱 / Moonshot / vLLM / Ollama）
#           anthropic（Anthropic Claude Messages API）
#           gemini（Google Gemini REST API）

active_profile: "default"

llm:
  provider: "openai_compatible"
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  api_key: ""          # <-- 预留位置：后续填入你的真实 API Key（或通过环境变量 LLM_API_KEY 注入）
  temperature: 0.1
  max_turns: 8
  timeout_seconds: 60

# 常用厂商预设参考（控制台前端也内置了对应一键填充按钮）
provider_presets:
  openai:
    label: "OpenAI"
    provider: "openai_compatible"
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
  deepseek:
    label: "DeepSeek"
    provider: "openai_compatible"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
  dashscope_qwen:
    label: "阿里云百炼 (Qwen)"
    provider: "openai_compatible"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"
  anthropic:
    label: "Anthropic Claude"
    provider: "anthropic"
    base_url: "https://api.anthropic.com"
    model: "claude-sonnet-4-20250514"
  gemini:
    label: "Google Gemini"
    provider: "gemini"
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    model: "gemini-2.5-flash"
  ollama_local:
    label: "本地 Ollama"
    provider: "openai_compatible"
    base_url: "http://127.0.0.1:11434/v1"
    model: "qwen2.5:7b"
